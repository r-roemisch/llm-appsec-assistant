name: ci

on:
  push:
  pull_request:

# Read-only token: CI checks, it never writes to the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the commit of a release, so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src
      - run: uv run pyright src
      # Offline: a scripted stand-in model, no Provider keys. Live smoke tests (marker "live")
      # need keys and are run by hand; DeepEval's pytest plugin is disabled in pyproject.toml.
      - run: uv run pytest -q
      # The Guard metrics report, as `rampart eval` writes it: free, no Model, no network.
      # (The documented rates themselves are asserted by tests/test_guards.py above.)
      - run: uv run rampart eval --suite guard --yes
        env:
          RAMPART_DATA_DIR: ${{ runner.temp }}/rampart-data
          RAMPART_EVAL_REPORTS_DIR: ${{ runner.temp }}/eval-reports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
