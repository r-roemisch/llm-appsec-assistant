[project]
name = "rampart-appsec"
version = "0.1.0"
description = "Rampart: an LLM application security assistant that is itself built as a secure agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Rudolf Roemisch" }]
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain-core>=1.7",
    "langchain-openai>=1.7",
    "langchain-ollama>=1.1",
    "langfuse>=5.2",
    "sse-starlette>=3.6",
    "argon2-cffi>=25.1",
    "typer>=0.27",
    "pyyaml>=6.0",
    "httpx>=0.28",
]

[project.scripts]
rampart = "rampart.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rampart"]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "pyright>=1.1.414",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: needs provider keys and network; excluded by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "typer.Option", "typer.Argument"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
typeCheckingMode = "standard"
